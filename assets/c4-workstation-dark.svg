<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence PowerShell workstation</title>
<desc id="desc">A compact Windows PowerShell inspired developer profile banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#171225"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#4ea1ff"/>
    <stop offset="1" stop-color="#a970ff"/>
  </linearGradient>
</defs>
<rect width="1200" height="320" rx="26" fill="url(#bg)"/>
<rect x="30" y="28" width="1140" height="264" rx="18" fill="#0c111b" stroke="#2a3346"/>
<rect x="30" y="28" width="1140" height="42" rx="18" fill="#111827"/>
<rect x="30" y="52" width="1140" height="18" fill="#111827"/>
<text x="58" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#b8c2d3">Windows PowerShell</text>
<text x="1110" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#6f7c90">—  □  ×</text>
<g font-family="Cascadia Mono,Consolas,ui-monospace,monospace">
  <text x="70" y="162" font-size="72" font-weight="700" fill="url(#accent)">BB&gt;</text>
  <text x="70" y="202" font-size="15" fill="#8ea0b8">.NET · PowerShell · Systems</text>

  <text x="430" y="118" font-size="15" fill="#8ea0b8">PS C:\Users\Bence&gt;</text>
  <text x="625" y="118" font-size="15" fill="#f3f6fb">whoami</text>
  <text x="430" y="154" font-size="15" fill="#8db8ff">itsmebencebudai</text>

  <text x="430" y="198" font-size="15" fill="#8ea0b8">PS C:\Users\Bence&gt;</text>
  <text x="625" y="198" font-size="15" fill="#f3f6fb">Get-Developer</text>
  <text x="430" y="234" font-size="15" fill="#dce5f3">Build useful things. Automate the repeatable parts.</text>

  <text x="430" y="268" font-size="15" fill="#8ea0b8">PS C:\Users\Bence&gt;</text>
  <rect x="625" y="254" width="10" height="18" rx="1.5" fill="#dce5f3">
    <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>