<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence developer profile</title>
<desc id="desc">Developer profile hero for Budai Bence, focused on .NET, backend systems, automation, and infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f17"/>
    <stop offset="0.55" stop-color="#101827"/>
    <stop offset="1" stop-color="#11131a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b8def"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#263043" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".36"/>
<circle cx="965" cy="85" r="150" fill="#5b8def" opacity=".12" filter="url(#glow)"/>
<circle cx="1085" cy="265" r="125" fill="#a78bfa" opacity=".10" filter="url(#glow)"/>
<rect x="42" y="36" width="1116" height="288" rx="18" fill="#0d1320" fill-opacity=".74" stroke="#2b3548"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="76" y="78" font-size="14" fill="#71809a" letter-spacing="2">BB.DEV // SYSTEMS</text>
  <circle cx="1090" cy="71" r="5" fill="#4ade80"/>
  <text x="1103" y="76" font-size="12" fill="#8ea0b8">ONLINE</text>

  <text x="76" y="143" font-size="50" font-weight="700" fill="#f4f7fb">BENCE BUDAI</text>
  <rect x="77" y="160" width="412" height="4" rx="2" fill="url(#accent)"/>

  <text x="76" y="205" font-size="21" fill="#c6d1e2">Software Developer · Backend · Automation · Infrastructure</text>
  <text x="76" y="244" font-size="16" fill="#7f8da5">&gt; building software from API to infrastructure</text>
  <rect x="482" y="230" width="10" height="20" rx="2" fill="#7f8da5">
    <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-size="13" font-weight="600">
    <rect x="76" y="274" width="68" height="28" rx="14" fill="#182237" stroke="#30436b"/><text x="93" y="293" fill="#9db7ff">C#</text>
    <rect x="154" y="274" width="76" height="28" rx="14" fill="#182237" stroke="#30436b"/><text x="174" y="293" fill="#9db7ff">.NET</text>
    <rect x="240" y="274" width="122" height="28" rx="14" fill="#182237" stroke="#30436b"/><text x="260" y="293" fill="#9db7ff">ASP.NET Core</text>
    <rect x="372" y="274" width="112" height="28" rx="14" fill="#211b34" stroke="#4a376a"/><text x="391" y="293" fill="#c7b1ff">PowerShell</text>
    <rect x="494" y="274" width="82" height="28" rx="14" fill="#162531" stroke="#294b5c"/><text x="513" y="293" fill="#9bd4ef">Docker</text>
    <rect x="586" y="274" width="111" height="28" rx="14" fill="#2a1d23" stroke="#5b3443"/><text x="604" y="293" fill="#f0b7c9">SQL Server</text>
  </g>

  <rect x="795" y="111" width="302" height="145" rx="14" fill="#0a0f18" stroke="#273146"/>
  <text x="817" y="138" font-size="13" fill="#6d7c95">bence@github:~$</text>
  <text x="817" y="166" font-size="13" fill="#d8e0ed">whoami</text>
  <text x="817" y="194" font-size="13" fill="#8ea0b8">role   </text><text x="878" y="194" font-size="13" fill="#9db7ff">systems builder</text>
  <text x="817" y="217" font-size="13" fill="#8ea0b8">focus  </text><text x="878" y="217" font-size="13" fill="#c7b1ff">useful tooling</text>
  <text x="817" y="240" font-size="13" fill="#8ea0b8">mode   </text><text x="878" y="240" font-size="13" fill="#86efac">shipping</text>
</g>
</svg>