<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence PowerShell workstation</title>
<desc id="desc">A compact Windows PowerShell inspired developer profile banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="1" stop-color="#f7f2ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#2f73d9"/>
    <stop offset="1" stop-color="#7751c8"/>
  </linearGradient>
</defs>
<rect width="1200" height="320" rx="26" fill="url(#bg)"/>
<rect x="30" y="28" width="1140" height="264" rx="18" fill="#ffffff" stroke="#cbd6e6"/>
<rect x="30" y="28" width="1140" height="42" rx="18" fill="#eef2f8"/>
<rect x="30" y="52" width="1140" height="18" fill="#eef2f8"/>
<text x="58" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4c596d">Windows PowerShell</text>
<text x="1110" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#7b8798">—  □  ×</text>
<g font-family="Cascadia Mono,Consolas,ui-monospace,monospace">
  <text x="70" y="162" font-size="72" font-weight="700" fill="url(#accent)">BB&gt;</text>
  <text x="70" y="202" font-size="15" fill="#69768b">.NET · PowerShell · Systems</text>

  <text x="430" y="118" font-size="15" fill="#69768b">PS C:\Users\Bence&gt;</text>
  <text x="625" y="118" font-size="15" fill="#182235">whoami</text>
  <text x="430" y="154" font-size="15" fill="#356fe3">itsmebencebudai</text>

  <text x="430" y="198" font-size="15" fill="#69768b">PS C:\Users\Bence&gt;</text>
  <text x="625" y="198" font-size="15" fill="#182235">Get-Developer</text>
  <text x="430" y="234" font-size="15" fill="#26364e">Build useful things. Automate the repeatable parts.</text>

  <text x="430" y="268" font-size="15" fill="#69768b">PS C:\Users\Bence&gt;</text>
  <rect x="625" y="254" width="10" height="18" rx="1.5" fill="#26364e">
    <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>