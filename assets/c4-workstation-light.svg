<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence developer workstation</title>
<desc id="desc">Animated Windows developer workstation banner for Budai Bence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7fbff"/>
    <stop offset=".55" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f7f2ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#2f73d9"/>
    <stop offset="1" stop-color="#7751c8"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#2f73d9" stop-opacity="0"/>
    <stop offset=".5" stop-color="#2f73d9" stop-opacity=".35"/>
    <stop offset="1" stop-color="#7751c8" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<circle cx="1030" cy="72" r="105" fill="#2f73d9" opacity=".04">
  <animate attributeName="r" values="90;118;90" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".02;.06;.02" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="170" cy="315" r="95" fill="#7751c8" opacity=".04">
  <animate attributeName="r" values="82;108;82" dur="7s" repeatCount="indefinite"/>
</circle>

<rect x="28" y="26" width="1144" height="306" rx="18" fill="#ffffff" stroke="#cbd6e6"/>
<rect x="28" y="26" width="1144" height="44" rx="18" fill="#eef2f8"/>
<rect x="28" y="52" width="1144" height="18" fill="#eef2f8"/>

<circle cx="55" cy="48" r="5" fill="#ff5f57"/>
<circle cx="73" cy="48" r="5" fill="#febc2e"/>
<circle cx="91" cy="48" r="5" fill="#28c840"/>
<text x="116" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4c596d">DEV WORKSTATION</text>

<g font-family="Cascadia Mono,Consolas,ui-monospace,monospace">
  <text x="70" y="164" font-size="74" font-weight="700" fill="url(#accent)">BB&gt;</text>
  <text x="70" y="205" font-size="15" fill="#69768b">.NET · PowerShell · Systems</text>

  <g transform="translate(70 238)">
    <circle cx="6" cy="6" r="5" fill="#198754">
      <animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="11" font-size="12" fill="#198754">ONLINE</text>
  </g>

  <text x="430" y="118" font-size="15" fill="#69768b">Dev:\ &gt;</text>
  <text x="510" y="118" font-size="15" fill="#182235">whoami</text>
  <text x="430" y="154" font-size="15" fill="#356fe3">itsmebencebudai</text>

  <text x="430" y="204" font-size="15" fill="#69768b">Dev:\ &gt;</text>
  <text x="510" y="204" font-size="15" fill="#182235">Get-Developer</text>
  <text x="430" y="240" font-size="15" fill="#26364e">C# / .NET · automation · infrastructure · tooling</text>

  <text x="430" y="290" font-size="15" fill="#69768b">Dev:\ &gt;</text>
  <rect x="510" y="276" width="10" height="18" rx="1.5" fill="#26364e">
    <animate attributeName="opacity" values="1;.12;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</g>

<g transform="translate(875 266)" font-family="Cascadia Mono,Consolas,monospace" font-size="11">
  <g><circle cx="5" cy="5" r="4" fill="#198754"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="16" y="9" fill="#69768b">BUILD</text></g>
  <g transform="translate(82 0)"><circle cx="5" cy="5" r="4" fill="#356fe3"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle><text x="16" y="9" fill="#69768b">AUTOMATE</text></g>
  <g transform="translate(195 0)"><circle cx="5" cy="5" r="4" fill="#7751c8"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="16" y="9" fill="#69768b">SHIP</text></g>
</g>

<rect x="52" y="82" width="1096" height="2" fill="url(#scan)" opacity=".7">
  <animate attributeName="y" values="82;312;82" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".08;.4;.08" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>