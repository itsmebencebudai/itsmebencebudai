<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence — software developer</title>
<desc id="desc">A profile header about building backend software, automation, and infrastructure from API to production.</desc>
