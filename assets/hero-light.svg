<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence developer profile</title>
<desc id="desc">Developer profile hero for Budai Bence, focused on .NET, backend systems, automation, and infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset=".55" stop-color="#eef4ff"/>
    <stop offset="1" stop-color="#f8f5ff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#356fe3"/>
    <stop offset="1" stop-color="#7c54d8"/>
  </linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#cfd9e8" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".55"/>
<rect x="42" y="36" width="1116" height="288" rx="18" fill="#ffffff" fill-opacity=".86" stroke="#c8d4e7"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="76" y="78" font-size="14" fill="#637089" letter-spacing="2">BB.DEV // SYSTEMS</text>
  <circle cx="1090" cy="71" r="5" fill="#22c55e"/>
  <text x="1103" y="76" font-size="12" fill="#637089">ONLINE</text>

  <text x="76" y="143" font-size="50" font-weight="700" fill="#172033">BENCE BUDAI</text>
  <rect x="77" y="160" width="412" height="4" rx="2" fill="url(#accent)"/>

  <text x="76" y="205" font-size="21" fill="#344258">Software Developer · Backend · Automation · Infrastructure</text>
  <text x="76" y="244" font-size="16" fill="#637089">&gt; building software from API to infrastructure</text>
  <rect x="482" y="230" width="10" height="20" rx="2" fill="#637089">
    <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-size="13" font-weight="600">
    <rect x="76" y="274" width="68" height="28" rx="14" fill="#eaf0ff" stroke="#bfd0f5"/><text x="93" y="293" fill="#2e5ebd">C#</text>
    <rect x="154" y="274" width="76" height="28" rx="14" fill="#eaf0ff" stroke="#bfd0f5"/><text x="174" y="293" fill="#2e5eBD">.NET</text>
    <rect x="240" y="274" width="122" height="28" rx="14" fill="#eaf0ff" stroke="#bfd0f5"/><text x="260" y="293" fill="#2e5ebd">ASP.NET Core</text>
    <rect x="372" y="274" width="112" height="28" rx="14" fill="#f0eafe" stroke="#d2c1f1"/><text x="391" y="293" fill="#6946b2">PowerShell</text>
    <rect x="494" y="274" width="82" height="28" rx="14" fill="#e9f7fb" stroke="#bce0ea"/><text x="513" y="293" fill="#27718d">Docker</text>
    <rect x="586" y="274" width="111" height="28" rx="14" fill="#fff0f3" stroke="#efc6ce"/><text x="604" y="293" fill="#a44962">SQL Server</text>
  </g>

  <rect x="795" y="111" width="302" height="145" rx="14" fill="#f8fafc" stroke="#c9d4e5"/>
  <text x="817" y="138" font-size="13" fill="#69768d">bence@github:~$</text>
  <text x="817" y="166" font-size="13" fill="#172033">whoami</text>
  <text x="817" y="194" font-size="13" fill="#637089">role   </text><text x="878" y="194" font-size="13" fill="#356fe3">systems builder</text>
  <text x="817" y="217" font-size="13" fill="#637089">focus  </text><text x="878" y="217" font-size="13" fill="#7c54d8">useful tooling</text>
  <text x="817" y="240" font-size="13" fill="#637089">mode   </text><text x="878" y="240" font-size="13" fill="#15803d">shipping</text>
</g>
</svg>