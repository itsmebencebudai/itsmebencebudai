  <rect x="746" y="57" width="392" height="246" rx="16" fill="#f2f5ec" stroke="#dbe2d5"/>
  <text x="773" y="88" font-size="11" font-weight="700" fill="#657167" letter-spacing="1.6">FROM API TO PRODUCTION</text>

