    <rect x="812" y="174" width="276" height="70" rx="16" fill="#131923" stroke="#2a3242"/>
    <text x="837" y="202" font-size="12" font-weight="700" fill="#78859a" letter-spacing="1.5">FOCUS</text>
    <text x="837" y="228" font-size="19" font-weight="700" fill="#e8edf5">Backend + Automation</text>

    <rect x="812" y="260" width="276" height="70" rx="16" fill="#131923" stroke="#2a3242"/>
    <text x="837" y="288" font-size="12" font-weight="700" fill="#78859a" letter-spacing="1.5">LAB</text>
    <text x="837" y="314" font-size="19" font-weight="700" fill="#e8edf5">Homelab · Local AI · MCP</text>
