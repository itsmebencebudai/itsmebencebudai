  <text x="74" y="166" font-size="54" font-weight="700" fill="#f5f7fb">Backend systems.</text>
  <text x="74" y="222" font-size="54" font-weight="700" fill="#f5f7fb">Automation. Infrastructure.</text>
  <rect x="74" y="246" width="320" height="4" rx="2" fill="url(#accent)"/>
  <text x="74" y="290" font-size="18" fill="#a8b2c2">C# · .NET · ASP.NET Core · SQL Server · PowerShell</text>
  <text x="74" y="323" font-size="15" fill="#748094">Budapest, Hungary · Building useful systems from API to deployment</text>

  <g>
    <rect x="812" y="88" width="276" height="70" rx="16" fill="#131923" stroke="#2a3242"/>
