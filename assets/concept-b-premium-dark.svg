<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Budai Bence premium developer profile</title>
<desc id="desc">Minimal developer dashboard for Budai Bence focused on backend, automation, and infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0d12"/>
    <stop offset="1" stop-color="#11151d"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#5b8def"/>
    <stop offset="1" stop-color="#7c5cff"/>
  </linearGradient>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="36" y="36" width="1128" height="348" rx="22" fill="#0f131a" stroke="#242a36"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
