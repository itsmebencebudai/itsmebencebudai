<text class="c" x="28" y="190" fill="#7dd3fc" style="--n:16;--d:0.72s;--s:4.15s">$ infra --status</text>
<text class="c" x="28" y="216" fill="#c3cadf" style="--n:51;--d:0.92s;--s:5.12s">Windows Server · IIS · Docker · Tailscale · homelab</text>
