<text x="480.0" y="26" text-anchor="middle" fill="#5d6788" style="font-size:13px">bence@github — zsh</text>
<text class="c" x="28" y="78" fill="#7dd3fc" style="--n:8;--d:0.36s;--s:0.40s">$ whoami</text>
<text class="c" x="28" y="104" fill="#c3cadf" style="--n:42;--d:0.76s;--s:1.01s">Budai Bence - software developer, Budapest</text>
<text class="c" x="28" y="134" fill="#7dd3fc" style="--n:14;--d:0.63s;--s:2.07s">$ stack --list</text>
