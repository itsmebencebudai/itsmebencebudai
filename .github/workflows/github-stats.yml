name: Generate GitHub stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
      EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Check ACCESS_TOKEN
        id: token
        shell: bash
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ACCESS_TOKEN is not configured; skipping github-stats generation."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Zig
        if: steps.token.outputs.available == 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Build jstrieb/github-stats
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          rm -rf .github-stats-src
          git clone --quiet https://github.com/jstrieb/github-stats.git .github-stats-src
          cd .github-stats-src
          git checkout --quiet ef574fae2ce8311f3e1ebb43e07c0c0fae0a41b6
          zig build

      - name: Generate statistics SVGs
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          ./.github-stats-src/zig-out/bin/github-stats \
            --overview-output-file assets/github-stats-overview.svg \
            --languages-output-file assets/github-stats-languages.svg \
            --silent \
            --max-retries 5

      - name: Commit generated statistics
        if: steps.token.outputs.available == 'true'
        shell: bash
        run: |
          rm -rf .github-stats-src

          if git diff --quiet -- assets/github-stats-overview.svg assets/github-stats-languages.svg; then
            echo "No statistics changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-overview.svg assets/github-stats-languages.svg
          git commit -m "chore: refresh github-stats"
          git push
