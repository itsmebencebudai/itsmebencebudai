name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches:
      - main
    paths:
      - "data/profile.json"
      - "scripts/generate-stats.ps1"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG stats
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/generate-stats.ps1

      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet -- assets/live-stats-dark.svg assets/live-stats-light.svg; then
            echo "No stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-stats-dark.svg assets/live-stats-light.svg
          git commit -m "chore: refresh profile stats"
          git push
